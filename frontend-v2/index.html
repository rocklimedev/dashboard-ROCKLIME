<!doctype html>
<html lang="en">
  <head>
    <!-- Charset & Compatibility -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Mobile Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0d6efd" />

    <!-- SEO Meta Tags -->
    <title>CM Trading Co. - Inventory & Orders Dashboard</title>

    <meta
      name="description"
      content="CM Trading Co. - Admin Panel to manage inventory, sales, orders, and customer data efficiently."
    />

    <meta
      name="keywords"
      content="CM Trading, inventory management, sales dashboard, orders management, admin panel"
    />

    <meta name="author" content="CM Trading Co." />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="CM Trading Co. - Inventory & Orders Dashboard"
    />

    <meta
      property="og:description"

      name="twitter:title"
      content="CM Trading Co. - Inventory & Orders Dashboard"
    />

    <meta
      name="twitter:description"
      content="Manage inventory, sales, and customer orders efficiently with CM Trading Co."
    />

    <meta name="twitter:image" content="/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
